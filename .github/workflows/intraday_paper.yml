name: Intraday Paper Session (Alpaca Paper)

# D1b evaluates fixed check bars; their closes are 10:12, 10:58, 11:44, 12:30, 13:16, 14:02 and
# 14:48 ET, and the time exit is 15:30 ET (12:30 on 13:00 early closes). Each cron starts ~7
# minutes before one of these events; `--auto` waits for it (max 12 min) and catches up to 10
# minutes late. Both UTC hours are listed so the schedule works in EST (UTC-5) and EDT (UTC-4);
# the run with the wrong offset only manages stops and exits quickly. 15:38 / 15:50 ET are
# fallbacks that flatten and run the daily learning if the 15:30 run was delayed or dropped.
on:
  schedule:
    # Sesiune intraday continuă la fiecare 10 minute (14:00 - 21:00 UTC / 09:00 - 16:00 ET / 16:00 - 23:00 RO)
    - cron: "*/10 14-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod de execuție (auto / premarket / weekend / once / eod / init-state / reset-kill)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - premarket
          - weekend
          - once
          - eod
          - init-state
          - reset-kill

permissions:
  contents: write

concurrency:
  group: intraday-paper-session
  cancel-in-progress: false

jobs:
  trade:
    name: Sesiune Intraday SPY/QQQ (Alpaca Paper)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Intraday Session
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
          TRADING_MODE: "PAPER"
          BOT_CAPITAL: "500"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          HOUR_ET=$(TZ="America/New_York" date +%H)
          MIN_ET=$(TZ="America/New_York" date +%M)
          case "$MODE" in
            premarket)  uv run python scripts/run_intraday_session.py --premarket ;;
            weekend)    uv run python scripts/run_intraday_session.py --weekend ;;
            init-state) uv run python scripts/run_intraday_session.py --init-state ;;
            once)       uv run python scripts/run_intraday_session.py --once ;;
            eod)        uv run python scripts/run_intraday_session.py --eod ;;
            reset-kill) uv run python scripts/run_intraday_session.py --reset-kill ;;
            *)
              if [ "$HOUR_ET" = "08" ] || { [ "$HOUR_ET" = "09" ] && [ "$MIN_ET" -lt "25" ]; }; then
                uv run python scripts/run_intraday_session.py --premarket
              else
                uv run python scripts/run_intraday_session.py --auto
              fi
              ;;
          esac
