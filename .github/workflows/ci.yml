name: CI

on:
  push:
    branches-ignore:
      - state
  pull_request:
    branches-ignore:
      - state

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run checks
        run: bash scripts/check.sh
