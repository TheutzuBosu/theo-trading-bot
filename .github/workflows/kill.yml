name: Emergency Kill Switch (Alpaca Paper)

on:
  workflow_dispatch:

permissions:
  contents: write

# Own group: a KILL never waits behind a trading run (the trading run re-checks the remote
# kill switch before every entry and never uploads kill_switch.json itself).
concurrency:
  group: kill-switch
  cancel-in-progress: false

jobs:
  kill:
    name: Oprire de urgență (KILL) și lichidare poziții
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Execute Kill Switch
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
          TRADING_MODE: "PAPER"
          BOT_CAPITAL: "500"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: uv run python scripts/run_intraday_session.py --kill
